name: wgcna_galaxy
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # ── R base ───────────────────────────────────────────────────────────────
  # Pinned to 4.4 to match Bioconductor 3.20
  - r-base=4.4

  # ── WGCNA core ───────────────────────────────────────────────────────────
  - r-wgcna=1.74

  # ── Bioconductor 3.20 dependencies (R 4.4) ───────────────────────────────
  - bioconductor-limma=3.62.1
  - bioconductor-impute=1.80.0
  - bioconductor-preprocesscore=1.68.0

  # ── CRAN packages ────────────────────────────────────────────────────────
  - r-ggplot2=3.5.1
  - r-ggrepel=0.9.6
  - r-reshape2=1.4.4
  - r-pheatmap=1.0.12
  - r-igraph=2.1.1
  - r-rcolorbrewer=1.1_3
  - r-optparse=1.7.5
  - r-fastcluster=1.2.6
